{% extends "character/character_base.html" %}

{% block content %}
{% include "character/partials/_feature_detail.html" %}

<div class="mt-3 d-print-none">
    {% if group_back %}
    <a role="button" class="btn btn-outline-secondary" href="{% url 'character-available-group' character.id group_back.key %}">&larr; Back to {{ group_back.name }}</a>
    {% endif %}
    <a role="button" class="btn btn-secondary" href="{% url 'character-detail' character.id %}">Back to {{character}}</a>
</div>
{% endblock %}
